<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideSplit - Ride Sharing App</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ── Auth Screen ── -->
    <div id="auth-screen">
        <div class="auth-container">
            <h1 class="auth-logo">🚗 RideSplit</h1>
            <p class="auth-subtitle">Split rides, split costs.</p>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Log In</button>
                <button class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <div id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="you@email.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="handleLogin()">Log In</button>
                <p id="login-error" class="auth-error"></p>
            </div>

            <div id="signup-form" style="display:none;">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="you@email.com">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Min. 6 characters">
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="handleSignup()">Create Account</button>
                <p id="signup-error" class="auth-error"></p>
                <p id="signup-success" class="auth-success"></p>
            </div>
        </div>
    </div>

    <!-- ── Main App ── -->
    <div id="app" style="display:none; width:100%; display:none;">

        <nav class="navbar">
            <div class="nav-container">
                <h1 class="nav-logo">🚗 RideSplit</h1>
                <ul class="nav-menu">
                    <li><a href="#dashboard" class="nav-link">Dashboard</a></li>
                    <li><a href="#trips" class="nav-link">Trips</a></li>
                    <li><a href="#vehicles" class="nav-link">Vehicles</a></li>
                    <li><a href="#profile" class="nav-link">Profile</a></li>
                </ul>
                <div class="nav-footer">
                    <button class="btn btn-secondary" style="width:100%;margin-top:auto;" onclick="handleLogout()">Log Out</button>
                </div>
            </div>
        </nav>

        <main class="main-content">

            <!-- Dashboard -->
            <section id="dashboard" class="page active">
                <h2>Dashboard</h2>
                <div class="dashboard-grid">
                    <div class="section-card">
                        <div class="section-card-header" onclick="toggleSection('my-trips-body', this)">
                            <div class="header-left"><h3>My Trips</h3></div>
                            <span class="section-toggle-arrow">▼</span>
                        </div>
                        <div id="my-trips-body" class="section-card-body collapsed">
                            <div id="my-trips" style="padding-top:16px;"></div>
                        </div>
                    </div>
                    <div class="section-card">
                        <div class="section-card-header" onclick="toggleSection('quick-actions-body', this)">
                            <div class="header-left"><h3>Quick Actions</h3></div>
                            <span class="section-toggle-arrow">▼</span>
                        </div>
                        <div id="quick-actions-body" class="section-card-body collapsed">
                            <div class="action-buttons" style="padding-top:16px;">
                                <button class="btn btn-primary" onclick="showCreateTripForm()">Create Trip</button>
                                <button class="btn btn-secondary" onclick="showAddVehicleForm()">Add Vehicle</button>
                            </div>
                        </div>
                    </div>
                    <div class="section-card">
                        <div class="section-card-header" onclick="toggleSection('recent-activity-body', this)">
                            <div class="header-left"><h3>Recent Activity</h3></div>
                            <span class="section-toggle-arrow">▼</span>
                        </div>
                        <div id="recent-activity-body" class="section-card-body collapsed">
                            <div id="recent-activity" style="padding-top:16px;"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Trips -->
            <section id="trips" class="page">
                <h2>All Trips</h2>
                <div class="trips-header">
                    <button class="btn btn-primary" onclick="showCreateTripForm()">Create New Trip</button>
                </div>
                <div id="trips-list"></div>
            </section>

            <!-- Vehicles -->
            <section id="vehicles" class="page">
                <h2>My Vehicles</h2>
                <div class="section-card" style="margin-bottom:20px;">
                    <div class="section-card-header" onclick="toggleSection('add-vehicle-body', this)">
                        <div class="header-left"><h3>Add a Vehicle</h3></div>
                        <span class="section-toggle-arrow">▼</span>
                    </div>
                    <div id="add-vehicle-body" class="section-card-body collapsed">
                        <div style="padding-top:16px;">
                            <button class="btn btn-primary" onclick="showAddVehicleForm()">Add Vehicle</button>
                        </div>
                    </div>
                </div>
                <div class="section-card">
                    <div class="section-card-header" onclick="toggleSection('vehicles-list-body', this)">
                        <div class="header-left"><h3>My Vehicles</h3></div>
                        <span class="section-toggle-arrow">▼</span>
                    </div>
                    <div id="vehicles-list-body" class="section-card-body collapsed">
                        <div id="vehicles-list" style="padding-top:16px;"></div>
                    </div>
                </div>
            </section>

            <!-- Profile -->
            <section id="profile" class="page">
                <h2>My Profile</h2>
                <div class="section-card">
                    <div class="section-card-header" onclick="toggleSection('profile-body', this)">
                        <div class="header-left"><h3>Account Details</h3></div>
                        <span class="section-toggle-arrow">▼</span>
                    </div>
                    <div id="profile-body" class="section-card-body collapsed">
                        <div style="padding: 16px 0 4px;">
                            <form id="profile-form">
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" name="email" required>
                                </div>
                                <div class="form-group">
                                    <label for="full-name">Full Name</label>
                                    <input type="text" id="full-name" name="full_name" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Update Profile</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
