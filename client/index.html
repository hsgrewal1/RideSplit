<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideSplit - Ride Sharing App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">🚗 RideSplit</h1>
            <ul class="nav-menu">
                <li><a href="#dashboard" class="nav-link">Dashboard</a></li>
                <li><a href="#trips" class="nav-link">Trips</a></li>
                <li><a href="#vehicles" class="nav-link">Vehicles</a></li>
                <li><a href="#profile" class="nav-link">Profile</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">

        <!-- ── Dashboard Page ── -->
        <section id="dashboard" class="page active">
            <h2>Dashboard</h2>
            <div class="dashboard-grid">

                <!-- My Trips card -->
                <div class="section-card">
                    <div class="section-card-header" onclick="toggleSection('my-trips-body', this)">
                        <div class="header-left">
                            <h3>My Trips</h3>
                        </div>
                        <span class="section-toggle-arrow">▼</span>
                    </div>
                    <div id="my-trips-body" class="section-card-body collapsed">
                        <div id="my-trips" class="trip-list" style="padding-top:16px;">
                            <!-- Loaded by JS -->
                        </div>
                    </div>
                </div>

                <!-- Quick Actions card -->
                <div class="section-card">
                    <div class="section-card-header" onclick="toggleSection('quick-actions-body', this)">
                        <div class="header-left">
                            <h3>Quick Actions</h3>
                        </div>
                        <span class="section-toggle-arrow">▼</span>
                    </div>
                    <div id="quick-actions-body" class="section-card-body collapsed">
                        <div class="action-buttons" style="padding-top:16px;">
                            <button class="btn btn-primary" onclick="showCreateTripForm()">Create Trip</button>
                            <button class="btn btn-secondary" onclick="showAddVehicleForm()">Add Vehicle</button>
                        </div>
                    </div>
                </div>

                <!-- Recent Activity card -->
                <div class="section-card">
                    <div class="section-card-header" onclick="toggleSection('recent-activity-body', this)">
                        <div class="header-left">
                            <h3>Recent Activity</h3>
                        </div>
                        <span class="section-toggle-arrow">▼</span>
                    </div>
                    <div id="recent-activity-body" class="section-card-body collapsed">
                        <div id="recent-activity" style="padding-top:16px;">
                            <!-- Loaded by JS -->
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- ── Trips Page ── -->
        <section id="trips" class="page">
            <h2>All Trips</h2>
            <div class="trips-header">
                <button class="btn btn-primary" onclick="showCreateTripForm()">Create New Trip</button>
            </div>
            <div id="trips-list">
                <!-- Loaded by JS -->
            </div>
        </section>

        <!-- ── Vehicles Page ── -->
        <section id="vehicles" class="page">
            <h2>My Vehicles</h2>

            <!-- Add Vehicle collapsible -->
            <div class="section-card" style="margin-bottom:20px;">
                <div class="section-card-header" onclick="toggleSection('add-vehicle-body', this)">
                    <div class="header-left">
                        <h3>Add a Vehicle</h3>
                    </div>
                    <span class="section-toggle-arrow">▼</span>
                </div>
                <div id="add-vehicle-body" class="section-card-body collapsed">
                    <div style="padding-top:16px;">
                        <button class="btn btn-primary" onclick="showAddVehicleForm()">Add Vehicle</button>
                    </div>
                </div>
            </div>

            <!-- My Vehicles collapsible -->
            <div class="section-card">
                <div class="section-card-header" onclick="toggleSection('vehicles-list-body', this)">
                    <div class="header-left">
                        <h3>My Vehicles</h3>
                    </div>
                    <span class="section-toggle-arrow">▼</span>
                </div>
                <div id="vehicles-list-body" class="section-card-body collapsed">
                    <div id="vehicles-list" style="padding-top:16px;">
                        <!-- Loaded by JS -->
                    </div>
                </div>
            </div>
        </section>

        <!-- ── Profile Page ── -->
        <section id="profile" class="page">
            <h2>My Profile</h2>

            <div class="section-card">
                <div class="section-card-header" onclick="toggleSection('profile-body', this)">
                    <div class="header-left">
                        <h3>Account Details</h3>
                    </div>
                    <span class="section-toggle-arrow">▼</span>
                </div>
                <div id="profile-body" class="section-card-body collapsed">
                    <div class="profile-form" style="background:none; border:none; padding: 16px 0 4px;">
                        <form id="profile-form">
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="full-name">Full Name</label>
                                <input type="text" id="full-name" name="full_name" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>ript>
</body>
</html>
